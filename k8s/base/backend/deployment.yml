apiVersion: apps/v1
kind: Deployment
metadata:
  name: daily8-backend
  labels:
    app.kubernetes.io/name: daily8
    app.kubernetes.io/component: daily8-backend
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: daily8
      app.kubernetes.io/component: daily8-backend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: daily8
        app.kubernetes.io/component: daily8-backend

    spec:
      serviceAccountName: daily8-backend-service-account
      imagePullSecrets:
        - name: daily8-ghcr-secret
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: daily8-backend
          image: daily8-backend-image
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5010
              protocol: TCP

          envFrom:
            - configMapRef:
                name: daily8-backend-config

            - secretRef:
                name: daily8-backend-secret

          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: daily8-dev-db-owner
                  key: password

            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: daily8-redis-auth
                  key: password

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
