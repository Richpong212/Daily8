name: Daily8 Client-Sub CI/CD
#

on:
  push:
    branches:
      - dev
    paths:
      - "client-sub/**"
      - ".github/workflows/client-sub.yml"

  pull_request:
    branches:
      - dev
    paths:
      - "client-sub/**"
      - ".github/workflows/client-sub.yml"

concurrency:
  group: daily8-client-sub-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/richpong212/daily8/client-sub
  IMAGE_TAG: ${{ github.sha }}
  YARN_VERSION: 4.9.4

  BUILD_CONTEXT: ./client-sub
  DOCKERFILE_PATH: ./client-sub/Dockerfile.client-sub
  KUSTOMIZATION_PATH: k8s/overlays/dev/kustomization.yml

jobs:
  check:
    name: Check client-sub client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@${YARN_VERSION} --activate

      - name: Install client dependencies
        working-directory: client-sub
        run: yarn install --immutable

      - name: Run client checks
        working-directory: client-sub
        run: yarn lint && npx tsc --noEmit

  dependency-scan:
    name: Scan client-sub dependencies
    runs-on: ubuntu-latest
    needs:
      - check

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Scan client filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: client-sub
          scanners: vuln,secret
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  image-scan:
    name: Build and scan client-sub image
    runs-on: ubuntu-latest
    needs:
      - dependency-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build a local AMD64 image for testing on the GitHub-hosted runner.
      - name: Build client-sub image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: false
          load: true
          platforms: linux/amd64
          no-cache: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            VITE_API_URL=${{ vars.DAILY8_DEV_API_URL }}
            VITE_PUBLIC_BASE_URL=${{ vars.DAILY8_DEV_CLIENT_SUB_URL }}
            VITE_STRIPE_PUBLISHABLE_KEY=${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
            VITE_GA_MEASUREMENT_ID=${{ vars.VITE_GA_MEASUREMENT_ID }}
            VITE_REDDIT_PIXEL_ID=${{ vars.VITE_REDDIT_PIXEL_ID }}
            VITE_META_PIXEL_ID=${{ vars.VITE_META_PIXEL_ID }}

      - name: Verify client-sub runtime starts
        run: |
          container_id=$(docker run -d \
            -p 3008:3008 \
            "${IMAGE_NAME}:${IMAGE_TAG}")

          cleanup() {
            docker logs "${container_id}" || true
            docker rm -f "${container_id}" || true
          }

          trap cleanup EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3008 >/dev/null; then
              echo "Client-sub runtime is reachable on port 3008"
              exit 0
            fi

            sleep 2
          done

          echo "Client-sub runtime failed to become ready"
          exit 1

      - name: Verify runtime contains no esbuild binaries
        run: |
          docker run --rm \
            --entrypoint sh \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            -c '
              set -eu

              if find /app/node_modules \
                \( -path "*/@esbuild/*/bin/esbuild" -o \
                   -path "*/esbuild/bin/esbuild" -o \
                   -path "*/.bin/esbuild" \) \
                -print \
                | grep -q .; then
                echo "esbuild binaries must not exist in the runtime image"
                exit 1
              fi
            '

      - name: Scan client-sub image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate client-sub SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: cyclonedx
          output: client-sub-sbom.cdx.json

      - name: Upload client-sub SBOM
        uses: actions/upload-artifact@v6
        with:
          name: daily8-client-sub-sbom-${{ env.IMAGE_TAG }}
          path: client-sub-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish client-sub image
    runs-on: ubuntu-latest
    needs:
      - image-scan

    if: github.event_name == 'push'

    outputs:
      image-digest: ${{ steps.publish-image.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-architecture client-sub image
        id: publish-image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          platforms: linux/amd64,linux/arm64
          no-cache: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:dev
          build-args: |
            VITE_API_URL=${{ vars.DAILY8_DEV_API_URL }}
            VITE_PUBLIC_BASE_URL=${{ vars.DAILY8_DEV_CLIENT_SUB_URL }}
            VITE_STRIPE_PUBLISHABLE_KEY=${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
            VITE_GA_MEASUREMENT_ID=${{ vars.VITE_GA_MEASUREMENT_ID }}
            VITE_REDDIT_PIXEL_ID=${{ vars.VITE_REDDIT_PIXEL_ID }}
            VITE_META_PIXEL_ID=${{ vars.VITE_META_PIXEL_ID }}

      - name: Verify published client-sub image
        run: |
          docker buildx imagetools inspect \
            "${IMAGE_NAME}:${IMAGE_TAG}"

  sign:
    name: Sign client-sub image
    runs-on: ubuntu-latest
    needs:
      - publish

    if: github.event_name == 'push'

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign client-sub image
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.image-digest }}
        run: |
          cosign sign --yes \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"

  update-dev:
    name: Update client-sub dev manifest
    runs-on: ubuntu-latest
    needs:
      - sign

    if: github.event_name == 'push'

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
          submodules: recursive

      - name: Update client-sub Kustomize image tag
        env:
          NEW_IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          python <<'PY'
          import os
          from pathlib import Path

          path = Path("k8s/overlays/dev/kustomization.yml")
          image_name = "daily8-client-sub-image"
          new_tag = os.environ["NEW_IMAGE_TAG"]

          lines = path.read_text().splitlines()
          inside_target_image = False
          updated = False

          for index, line in enumerate(lines):
              stripped = line.strip()

              if stripped.startswith("- name:"):
                  current_image = stripped.split(":", 1)[1].strip()
                  inside_target_image = current_image == image_name
                  continue

              if inside_target_image and stripped.startswith("newTag:"):
                  indentation = line[: len(line) - len(line.lstrip())]
                  lines[index] = f'{indentation}newTag: "{new_tag}"'
                  updated = True
                  break

          if not updated:
              raise SystemExit(
                  f"Could not find newTag for image '{image_name}' in {path}"
              )

          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Validate updated client-sub image tag
        run: |
          grep -A3 \
            "name: daily8-client-sub-image" \
            "${KUSTOMIZATION_PATH}"

      - name: Commit and push manifest update
        run: |
          git config user.name "Daily8 Platform Bot"
          git config user.email "platform-bot@daily8.io"

          git add "${KUSTOMIZATION_PATH}"

          if git diff --cached --quiet; then
            echo "No client-sub image tag change to commit"
            exit 0
          fi

          git commit \
            -m "chore: update Daily8 client-sub dev image to ${IMAGE_TAG}"

          git pull --rebase origin dev
          git push origin HEAD:dev
