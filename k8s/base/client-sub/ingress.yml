apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: daily8-client-sub
  labels:
    app.kubernetes.io/name: daily8
    app.kubernetes.io/component: daily8-client-sub

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - daily8-client-sub.richpong.com
      secretName: daily8-client-sub-richpong-com-tls

  rules:
    - host: daily8-client-sub.richpong.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: daily8-client-sub
                port:
                  number: 3008
